<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RGB Game</title>
    <link rel="stylesheet" href="bonus.css">
</head>
<body>

<main class="game-container">
    <h1>!! Guess The Color !!</h1>
    
    <div id="rgb-target">rgb(255, 255, 255)</div>

        <div class="score-lives">
            <p id="1">Score: <span id="score">0</span></p>
            <p id="2">Lives: <span id="lives">3</span></p>
        </div>

        <p id="pick">Click a color to start!</p>

        <div id="options"></div>

    <button id="reset-btn" style="display: none;">Play Again</button>
</main>

<script src="bonus.js"></script>
</html>
