<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Video Page</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #fff;
    }

    video {
      width: 80%;
      max-width: 900px;
      border: 2px solid #000;
    }
  </style>
</head>
<body>
  <!--
    Replace src with your video path, e.g. src="video/nature.mp4"
    Replace poster with your image path, e.g. poster="images/poster.jpg"
  -->
  <video
    src="video/nature.mp4"
    poster="images/poster.jpg"
    autoplay
    loop
    muted
    playsinline
    controls
  ></video>
</body>
</html>
