<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Video Page</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background-image: url('background_image.jpg');
      background-size: cover;
      background-position: center;
    }

    video {
      width: 80%;
      max-width: 900px;
      border: 5px solid #000;
      border-radius: 14px;
    }
  </style>

</head>
<body>

  <video
    src="Haikyuu.mp4"
    poster="Haikyuu.png"
    autoplay
    loop
    playsinline
    muted
    controls
    >Enjoy Watching Haikyuu!</video>

</body>
</html>
